<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Out-Mathed • Summit Duel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/duel.css">
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/","math-expression-evaluator":"/src/math-parser-browser.js"}}</script>
</head>
<body>
  <main>
    <section id="arena" aria-label="3D mountain duel"></section>
    <div id="loading">Loading the summit…</div>
    <header id="hud" class="panel">
      <div class="brand"><h1>OUT-MATHED <span>SUMMIT DUEL</span></h1><button id="invite">Copy invite link</button></div>
      <div class="score"><span id="blue">Blue · waiting</span><strong id="phase">Connecting…</strong><span id="red">Red · waiting</span></div>
    </header>
    <div id="countdown" aria-live="assertive" hidden>3</div>
    <section id="controls" class="panel">
      <div class="control-top"><strong id="side">Finding your side…</strong><span id="location">The dotted line is your path if unobstructed.</span></div>
      <form id="form"><label for="equation">y =</label><input id="equation" value="0" maxlength="200" autocomplete="off" spellcheck="false"><button id="lock" type="submit">Lock in</button></form>
      <div class="control-bottom"><span id="error" role="status">Both players choose secretly, then launch together.</span><button id="view">Summit view</button><button id="reset">New duel</button></div>
    </section>
  </main>
  <script type="module" src="/src/duel-client.js"></script>
</body>
</html>
